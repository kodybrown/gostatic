schema: 1
application:
  id: gostatic
  name: gostatic
  author: Kody Brown
  description: A very simple static file HTTP server.
build-steps:
  # The Go creator builds and verifies this input before packaging starts.
  - gather:
      - from: '${input-payload}'
        files: ['gostatic.exe', 'README.md', 'LICENSE.md']
  - run: _/doinstall/assemble-self-extracting.task
    with:
      builder: '${builder}'
      installer: '${installer}'
      launcher-template: '${launcher-template}'
      config: '${config}'
      output: '${package}'
      result-file: '${result-file}'
runtime:
  interactive: true
  commands:
    - {name: gostatic, executable: gostatic.exe}
  defaults:
    windows:
      add-to-path: true
